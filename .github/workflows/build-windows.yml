

name: Build Game Roulette

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PySide6
          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }

      - name: Find application
        shell: pwsh
        run: |
          if (Test-Path "game_roulette.py") {
            "APP_SCRIPT=game_roulette.py" >> $env:GITHUB_ENV
          } elseif (Test-Path "Game-Roulette-Windows-Package/game_roulette.py") {
            "APP_SCRIPT=Game-Roulette-Windows-Package/game_roulette.py" >> $env:GITHUB_ENV
          } else {
            throw "Could not find game_roulette.py"
          }

      - name: Build executable
        shell: pwsh
        run: |
          $iconPath = "Game-Roulette-Windows-Package/game_roulette_icon.ico"

          if (-not (Test-Path $iconPath)) {
            throw "Icon file not found: $iconPath"
          }

          $args = @(
            "--noconfirm",
            "--clean",
            "--windowed",
            "--name", "Game Roulette",
            "--icon", $iconPath,
            "--collect-all", "PySide6",
            $env:APP_SCRIPT
          )

          python -m PyInstaller @args

      - name: Package Windows app
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/Game Roulette/*" `
            -DestinationPath "Game-Roulette-Windows.zip" `
            -Force

      - name: Upload downloadable app
        uses: actions/upload-artifact@v5
        with:
          name: Game-Roulette-Windows
          path: Game-Roulette-Windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Game-Roulette-Windows.zip

